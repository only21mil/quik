name: Android main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Android main / verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact main head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Confirm exact main head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD" || {
            echo "Expected main head $EXPECTED_HEAD, checked out $actual_head" >&2
            exit 1
          }

      - name: Audit workflow safety
        run: bash scripts/tests/test-workflow-safety.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Test release configuration guard
        run: bash scripts/tests/test-release-config.sh

      - name: Compile Android instrumentation tests
        run: ./gradlew --no-daemon --stacktrace assembleDebugAndroidTest

      - name: Verify merged manifest authority
        run: ./gradlew --no-daemon --stacktrace :presentation:checkMergedManifestAuthority

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Stage debug APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(presentation/build/outputs/apk/debug/QUIK-v*-debug.apk)
          if (( ${#apk_files[@]} != 1 )); then
            echo "Expected exactly one debug APK, found ${#apk_files[@]}" >&2
            printf '%s\n' "${apk_files[@]}" >&2
            exit 1
          fi

          install -D -m 0644 "${apk_files[0]}" ci-artifacts/QUIK-debug.apk
          cd ci-artifacts
          sha256sum QUIK-debug.apk > QUIK-debug.apk.sha256
          sha256sum --check QUIK-debug.apk.sha256

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quik-android-debug-${{ github.sha }}
          path: |
            ci-artifacts/QUIK-debug.apk
            ci-artifacts/QUIK-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
