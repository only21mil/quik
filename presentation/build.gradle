apply plugin: 'com.android.application'
apply plugin: 'realm-android' // Realm needs to be before Kotlin or the build will fail
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def releaseSigningEnvironment = [
        keystorePath: System.getenv('QUIK_RELEASE_KEYSTORE_PATH'),
        keyAlias: System.getenv('QUIK_RELEASE_KEY_ALIAS'),
        storePassword: System.getenv('QUIK_RELEASE_STORE_PASSWORD'),
        keyPassword: System.getenv('QUIK_RELEASE_KEY_PASSWORD'),
        approvedBy: System.getenv('QUIK_RELEASE_SIGNING_APPROVED_BY'),
        approvalRef: System.getenv('QUIK_RELEASE_SIGNING_APPROVAL_REF'),
]

def releaseSigningProblems = {
    def problems = []
    def requiredValues = [
            QUIK_RELEASE_KEYSTORE_PATH: releaseSigningEnvironment.keystorePath,
            QUIK_RELEASE_KEY_ALIAS: releaseSigningEnvironment.keyAlias,
            QUIK_RELEASE_STORE_PASSWORD: releaseSigningEnvironment.storePassword,
            QUIK_RELEASE_KEY_PASSWORD: releaseSigningEnvironment.keyPassword,
            QUIK_RELEASE_SIGNING_APPROVED_BY: releaseSigningEnvironment.approvedBy,
            QUIK_RELEASE_SIGNING_APPROVAL_REF: releaseSigningEnvironment.approvalRef,
    ]

    requiredValues.each { name, value ->
        if (value == null || value.trim().isEmpty()) {
            problems.add("${name} is required")
        }
    }

    if (releaseSigningEnvironment.approvedBy != null &&
            !releaseSigningEnvironment.approvedBy.trim().isEmpty() &&
            !['Victor', 'Rachel'].contains(releaseSigningEnvironment.approvedBy)) {
        problems.add('QUIK_RELEASE_SIGNING_APPROVED_BY must be Victor or Rachel')
    }

    if (releaseSigningEnvironment.keystorePath != null &&
            !releaseSigningEnvironment.keystorePath.trim().isEmpty()) {
        def configuredFile = new File(releaseSigningEnvironment.keystorePath.trim())
        if (!configuredFile.isAbsolute()) {
            problems.add('QUIK_RELEASE_KEYSTORE_PATH must be absolute')
        } else {
            try {
                def configuredPath = configuredFile.toPath()
                def canonicalPath = configuredFile.canonicalFile.toPath()
                def repositoryPath = rootProject.projectDir.canonicalFile.toPath()

                if (canonicalPath.startsWith(repositoryPath)) {
                    problems.add('QUIK_RELEASE_KEYSTORE_PATH must resolve outside the repository')
                }
                if (java.nio.file.Files.isSymbolicLink(configuredPath)) {
                    problems.add('QUIK_RELEASE_KEYSTORE_PATH must not be a symbolic link')
                }
                if (!java.nio.file.Files.isRegularFile(
                        configuredPath, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                    problems.add('QUIK_RELEASE_KEYSTORE_PATH must name an existing regular file')
                } else {
                    def owner = java.nio.file.Files.getOwner(
                            configuredPath, java.nio.file.LinkOption.NOFOLLOW_LINKS)
                    def processUser = java.lang.ProcessHandle.current().info().user().orElse(null)
                    if (processUser == null || processUser.isEmpty()) {
                        throw new IllegalStateException('effective process user is unavailable')
                    }
                    def processPrincipal = configuredPath.fileSystem.userPrincipalLookupService
                            .lookupPrincipalByName(processUser)
                    if (!owner.equals(processPrincipal)) {
                        problems.add(
                                'QUIK_RELEASE_KEYSTORE_PATH must be owned by the effective signing user')
                    }

                    def permissions = java.nio.file.Files.getPosixFilePermissions(configuredPath)
                    if (!permissions.contains(java.nio.file.attribute.PosixFilePermission.OWNER_READ)) {
                        problems.add('QUIK_RELEASE_KEYSTORE_PATH must be readable by its owner')
                    }
                    if (permissions.any { permission ->
                        permission.name().startsWith('GROUP_') ||
                                permission.name().startsWith('OTHERS_')
                    }) {
                        problems.add('QUIK_RELEASE_KEYSTORE_PATH must not grant group or other access')
                    }
                }
            } catch (Exception ignored) {
                problems.add('QUIK_RELEASE_KEYSTORE_PATH metadata could not be verified')
            }
        }
    }

    problems
}

def requireReleaseSigningConfiguration = {
    def problems = releaseSigningProblems()
    if (!problems.isEmpty()) {
        throw new GradleException(
                'Release signing configuration rejected:\n - ' + problems.join('\n - ') +
                        '\nSee docs/release-signing.md.')
    }
}

android {
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.only21mil.quik.reactions'
        minSdkVersion 23
        targetSdkVersion 33
        // Fork builds use upstreamCode * 1000 + forkRevision. See docs/fork-identity.md.
        versionCode 2238001
        versionName '4.3.6-reactions.1'
        setProperty("archivesBaseName", "QUIK-v${versionName}")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug // Uses the default debug keystore.
        release {
            if (releaseSigningProblems().isEmpty()) {
                storeFile new File(releaseSigningEnvironment.keystorePath.trim()).canonicalFile
                storeType 'PKCS12'
                keyAlias releaseSigningEnvironment.keyAlias.trim()
                storePassword releaseSigningEnvironment.storePassword
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue("string", "app_name", "QUIK Reactions Debug")
            signingConfig signingConfigs.debug
        }
        fdroid {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            applicationIdSuffix ".fdroid"
            versionNameSuffix "-fdroid"
            resValue("string", "app_name", "QUIK Reactions F-Droid")
        }
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lint {
        abortOnError true
        // AutoDispose 1.3.0 uses a module-analysis API that AGP 8.2 rejects.
        disable 'AutoDispose'
        baseline file("lint-baseline.xml")
    }
    namespace 'dev.octoshrimpy.quik'
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

configurations {
    debug
    release
    fdroid
}

dependencies {
    // lifecycle
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // androidx
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "androidx.emoji2:emoji2-bundled:$androidx_emoji2_version"
    implementation "androidx.constraintlayout:constraintlayout:$androidx_constraintlayout_version"
    implementation "androidx.core:core-ktx:$androidx_core_version"
    implementation "androidx.viewpager2:viewpager2:$androidx_viewpager_version"
    implementation "com.google.android.material:material:$material_version"
    implementation("androidx.work:work-runtime-ktx:$androidx_work_version")

    // conductor
    implementation "com.bluelinelabs:conductor:$conductor_version"
    implementation "com.bluelinelabs:conductor-archlifecycle:$conductor_version"

    // glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    // exoplayer
    implementation "com.github.google.ExoPlayer:exoplayer-core:$exoplayer_version"
    implementation("com.github.google.ExoPlayer:exoplayer-ui:$exoplayer_version", {
        exclude group: "com.android.support", module: "support-media-compat"
    })

    // rxbinding
    implementation "com.jakewharton.rxbinding2:rxbinding-kotlin:$rxbinding_version"
    implementation "com.jakewharton.rxbinding2:rxbinding-support-v4-kotlin:$rxbinding_version"

    // autodispose
    implementation "com.uber.autodispose:autodispose-android-archcomponents:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-android-archcomponents-test:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-android:$autodispose_version"
    implementation "com.uber.autodispose:autodispose:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-lifecycle:$autodispose_version"

    // dagger
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger_version"
    //Resolve jdk8+ Generation Annotations - javax annotation does not exist
    implementation 'com.github.pengrad:jdk9-deps:1ffe84c468'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // ezvcard
    implementation('com.googlecode.ez-vcard:ez-vcard:0.10.4', {
        exclude group: "org.jsoup", module: "jsoup"
        exclude group: "org.freemarker", module: "freemarker"
        exclude group: "com.fasterxml.jackson.core", module: "jackson-core"
    })

    // realm
    implementation "com.github.realm:realm-android-adapters:$realm_adapters_version"
    kapt "io.realm:realm-annotations:$realm_version"
    kapt "io.realm:realm-annotations-processor:$realm_version"

    // rxjava
    implementation "io.reactivex.rxjava2:rxandroid:$rxandroid_version"
    implementation "io.reactivex.rxjava2:rxjava:$rxjava_version"
    implementation "io.reactivex.rxjava2:rxkotlin:$rxkotlin_version"
    implementation "com.uber.rxdogtag:rxdogtag:$rxdogtag_version"
    implementation "com.uber.rxdogtag:rxdogtag-autodispose:$rxdogtag_version"


    // testing
    androidTestImplementation("androidx.test.espresso:espresso-core:$espresso_version", {
        exclude group: "com.android.support", module: "support-annotations"
    })
    androidTestImplementation "org.mockito:mockito-android:$mockito_version"
    testImplementation "androidx.test:runner:$androidx_testrunner_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"

    // moshi
    implementation "com.squareup.moshi:moshi:$moshi_version"
    debugImplementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    kapt "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx2:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:$coroutines_version"

    implementation "com.github.chrisbanes:photoview:2.1.4"
    implementation "com.f2prateek.rx.preferences2:rx-preferences:$rx_preferences_version"
    implementation "com.github.google:flexbox-layout:0.3.1"
    implementation "com.jakewharton.timber:timber:$timber_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation project(":android-smsmms")
    implementation project(":common")
    implementation project(':data')
    implementation project(':domain')

}
tasks.register('validateReleaseSigningConfiguration') {
    group = 'verification'
    description = 'Validates approved out-of-tree release signing inputs without reading the keystore.'
    doLast {
        requireReleaseSigningConfiguration()
    }
}

def releaseArtifactTaskNames = [
        'assembleRelease',
        'bundleRelease',
        'packageRelease',
        'packageReleaseBundle',
        'packageReleaseUniversalApk',
        'signReleaseBundle',
        'assembleFdroid',
        'bundleFdroid',
        'packageFdroid',
        'packageFdroidBundle',
        'packageFdroidUniversalApk',
        'signFdroidBundle',
] as Set

// Reject release artifact tasks before they can package or sign anything.
gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { task ->
        task.project == project && releaseArtifactTaskNames.contains(task.name)
    }) {
        requireReleaseSigningConfiguration()
    }
}

tasks.register('checkMergedManifestAuthority', Exec) {
    group = 'verification'
    description = 'Checks permissions, queries, and default-SMS-role components in every packaged manifest.'
    dependsOn 'processDebugMainManifest', 'processReleaseMainManifest', 'processFdroidMainManifest'
    commandLine 'python3', rootProject.file('scripts/check-merged-manifest-authority.py'), rootProject.projectDir
}

tasks.named('check') {
    dependsOn 'checkMergedManifestAuthority'
}
